services:
  bayan:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # خلف nginx على الخادم نفسه. الربط بـ 127.0.0.1 ضروري: Docker يتجاوز
      # الجدار الناري ufw، فمنفذ منشور على كل الواجهات يصل إليه العالم
      # مباشرة، ومعه اللوحة بلا تشفير. BAYAN_PORT يُضبط في .env.
      # Behind nginx on the same server. Binding to 127.0.0.1 is required: Docker
      # bypasses the ufw firewall, so a port published on all interfaces is
      # reachable by the whole world directly, and the dashboard with it,
      # unencrypted. BAYAN_PORT is set in .env.
      - "127.0.0.1:${BAYAN_PORT:-8000}:8000"
    # النموذج المحلي يأخذ كل الأنوية أثناء الفهرسة، فتُحدّ كي لا يبطئ ما
    # يشاركه الخادم. الذاكرة: نحو 2.5 GB وهو يعمل، وأكثر بنحو 1 GB أثناء الفهرسة،
    # فاترك BAYAN_MEM على 4g على الأقل، وارفعه إن سمح الخادم.
    # The local model takes every core during indexing, so it is capped to
    # avoid slowing down whatever shares the server. Memory: about 2.5 GB while
    # running, and about 1 GB more during indexing, so keep BAYAN_MEM at 4g at
    # least, and raise it if the server allows.
    mem_limit: ${BAYAN_MEM:-4g}
    cpus: ${BAYAN_CPUS:-2}
    volumes:
      - ./data:/srv/data
      # مفتاح نشر للقراءة فقط على مستودع الموقع
      # Read-only deploy key for the site repository
      - ~/.ssh/bayan_deploy_key:/root/.ssh/id_ed25519:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      interval: 60s
      timeout: 10s
      retries: 3
