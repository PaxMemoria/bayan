services:
  bayan:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # خلف nginx على الخادم نفسه. الربط بـ 127.0.0.1 ضروري: Docker يتجاوز
      # الجدار الناري ufw، فمنفذ منشور على كل الواجهات يصل إليه العالم
      # مباشرة، ومعه اللوحة بلا تشفير. BAYAN_PORT يُضبط في .env.
      # Behind nginx on the same server. Binding to 127.0.0.1 is required: Docker
      # bypasses the ufw firewall, so a port published on all interfaces is
      # reachable by the whole world directly, and the dashboard with it,
      # unencrypted. BAYAN_PORT is set in .env.
      - "127.0.0.1:${BAYAN_PORT:-8000}:8000"
    # النموذج المحلي يأخذ كل الأنوية أثناء الفهرسة، فتُحدّ كي لا يبطئ ما
    # يشاركه الخادم. الذاكرة: نحو 2.5 GB وهو يعمل، وأكثر بنحو 1 GB أثناء الفهرسة،
    # فاترك BAYAN_MEM على 4g على الأقل، وارفعه إن سمح الخادم.
    # The local model takes every core during indexing, so it is capped to
    # avoid slowing down whatever shares the server. Memory: about 2.5 GB while
    # running, and about 1 GB more during indexing, so keep BAYAN_MEM at 4g at
    # least, and raise it if the server allows.
    mem_limit: ${BAYAN_MEM:-4g}
    cpus: ${BAYAN_CPUS:-2}
    volumes:
      - ./data:/srv/data
      # مفتاح نشر للقراءة فقط على مستودع الموقع
      # Read-only deploy key for the site repository
      - ~/.ssh/bayan_deploy_key:/root/.ssh/id_ed25519:ro
    # سجلّ Docker محدود الحجم، وبيان لا يكتب فيه نص الأسئلة (سياسة الخصوصية)
    # Docker's log is size-capped, and Bayan writes no question text to it
    # (privacy policy)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      interval: 60s
      timeout: 10s
      retries: 3

  # النموذج المحلي لردود تعليقات فيسبوك (COMMENT_ANSWER_MODEL=local في .env، مع
  # LOCAL_LLM_URL=http://llm:8080/v1). ملف GGUF في ./models، ولا يعمل إلا بالملف
  # الشخصي llm: ضع COMPOSE_PROFILES=llm في .env أو شغّله بـ --profile llm.
  # طلب بيان الكامل (التعليمات والنظرة العامة والمصادر والمحادثة) نحو 8500 رمز،
  # فالسياق 16384، والجزء الثابت يبقى في الذاكرة بين الطلبات (--cache-reuse).
  # الذاكرة: نحو 2 GB للنموذج و2 GB للسياق. المنفذ داخلي فقط.
  # The local model for Facebook comment replies (COMMENT_ANSWER_MODEL=local in
  # .env, with LOCAL_LLM_URL=http://llm:8080/v1). The GGUF file lives in
  # ./models, and the service runs only under the llm profile: put
  # COMPOSE_PROFILES=llm in .env or start it with --profile llm. Bayan's full
  # prompt (instructions, overview, sources, history) runs to about 8,500
  # tokens, so the context is 16384; the fixed prefix stays cached between
  # requests (--cache-reuse). Memory: about 2 GB for the model and 2 GB for
  # the context. Internal port only.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [llm]
    restart: unless-stopped
    command: >
      -m /models/${LOCAL_LLM_FILE:-tiny-aya-global-q4_k_m.gguf}
      --host 0.0.0.0 --port 8080 --ctx-size ${LLM_CTX:-16384} --jinja
      --threads ${LLM_THREADS:-4} --parallel 1 --cache-reuse 256
    volumes:
      - ./models:/models:ro
    mem_limit: ${LLM_MEM:-6g}
    cpus: ${LLM_CPUS:-3}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
